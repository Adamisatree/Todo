name: Desktop builds
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['arena/3b82d6f0-todo']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: package:win
            artifact: Linea-Windows
          - os: macos-latest
            command: package:mac
            artifact: Linea-macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package desktop app
        shell: bash
        run: |
          set -o pipefail
          npm run ${{ matrix.command }} 2>&1 | tee build.log || {
            echo "::error::$(tail -18 build.log | tr '\n' ' ' | sed 's/::/--/g')"
            exit 1
          }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
